version: 2.1
workflows:
  build_and_deploy:
    jobs:
      - build
      - deploy:
          requires:
            - build
          context:
            - GITHUB
          filters:
            branches:
              only:
                - master
                - main
jobs:
  build:
    working_directory: ~/package
    machine:
      image: ubuntu-2204:2025.09.1
    steps:
      - checkout
      - run:
          name: Start Floci and create test resources
          command: |
            mkdir -p volume/floci-data
            docker compose -f docker-compose-test.yml up -d
            echo "Waiting for Floci to be healthy..."
            for i in $(seq 1 60); do
              status=$(docker inspect --format='{{.State.Health.Status}}' floci_test 2>/dev/null || echo "starting")
              if [ "$status" = "healthy" ]; then
                echo "Floci is healthy"
                break
              fi
              sleep 2
            done
      - run:
          name: Test Package
          environment:
            AWS_REGION: eu-west-1
            AWS_ACCESS_KEY_ID: test
            AWS_SECRET_ACCESS_KEY: test
            AWS_ENDPOINT_URL: http://localhost:4566
          command: |
            node --version
            yarn
            yarn test
      - run:
          name: Floci logs (on failure)
          when: on_fail
          command: |
            docker ps -a
            docker logs floci_test || true
  deploy:
    working_directory: ~/package
    resource_class: small
    docker:
      # cimg/node:24.18.0 ships npm 11.16.0; CircleCI OIDC trusted
      # publishing requires npm >= 11.11.0 (same pattern as tibber-dsf /
      # tibber-httpclient).
      - image: cimg/node:24.18.0
    steps:
      - checkout
      - run:
          name: Deploy Package
          command: |
            export GH_TOKEN=$GITHUB_AUTH_TOKEN
            yarn
            # semantic-release computes the version from commits, tags, and
            # creates the GitHub release; npmPublish is off in .releaserc.js
            # so the publish itself happens below via OIDC trusted publishing
            # (no stored npm token, nothing for 2FA to block).
            yarn release
            V=$(node -p "require('./package.json').version")
            if npm view "tibber-aws@$V" version >/dev/null 2>&1; then
              echo "tibber-aws@$V already published, skipping"
              exit 0
            fi
            NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
            export NPM_ID_TOKEN
            # Provenance is emitted automatically under trusted publishing —
            # no --provenance flag needed.
            npm publish
