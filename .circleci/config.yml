version: 2.1
workflows:
  build_and_deploy:
    jobs:
      - build
      - deploy:
          requires:
            - build
          context:
            - GITHUB
          filters:
            branches:
              only:
                - master
                - main
jobs:
  build:
    working_directory: ~/package
    machine:
      image: ubuntu-2204:2025.09.1
    steps:
      - checkout
      - run:
          name: Start Floci and create test resources
          command: |
            mkdir -p volume/floci-data
            docker compose -f docker-compose-test.yml up -d
            echo "Waiting for Floci to be healthy..."
            for i in $(seq 1 60); do
              status=$(docker inspect --format='{{.State.Health.Status}}' floci_test 2>/dev/null || echo "starting")
              if [ "$status" = "healthy" ]; then
                echo "Floci is healthy"
                break
              fi
              sleep 2
            done
      - run:
          name: Test Package
          command: |
            node --version
            yarn
            yarn test
      - run:
          name: Floci logs (on failure)
          when: on_fail
          command: |
            docker ps -a
            docker logs floci_test || true
  deploy:
    working_directory: ~/package
    resource_class: small
    docker:
      - image: cimg/node:24.18.0
    steps:
      - checkout
      - run:
          name: Deploy Package
          command: |
            export GH_TOKEN=$GITHUB_AUTH_TOKEN
            yarn
            # semantic-release computes the version from commits, tags, and
            # creates the GitHub release; npmPublish is off in .releaserc.js
            # so the publish itself happens below, to GitHub Packages
            # (publishConfig.registry in package.json).
            yarn release
            NAME=$(node -p "require('./package.json').name")
            V=$(node -p "require('./package.json').version")
            # Without a release, package.json keeps its frozen in-repo version
            # (7.0.23), which must not be published. semantic-release tags HEAD
            # when it releases, so publish only then.
            if ! git tag --points-at HEAD | grep -qx "v$V"; then
              echo "No release on this commit, skipping publish"
              exit 0
            fi
            echo "//npm.pkg.github.com/:_authToken=$GITHUB_AUTH_TOKEN" > ~/.npmrc
            if npm view "$NAME@$V" version --registry https://npm.pkg.github.com/ >/dev/null 2>&1; then
              echo "$NAME@$V already published, skipping"
              exit 0
            fi
            npm publish
